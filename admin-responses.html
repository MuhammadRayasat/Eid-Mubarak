<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d4d3d">
    <title>Admin — User Responses | Eid Mubarak</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230d4d3d'/%3E%3Cpath d='M63 15a35 35 0 1 0 0 70 28 28 0 1 1 0-70z' fill='%23ffd700'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-green: #0d4d3d;
            --light-green: #1a7a5e;
            --black: #0a0a0a;
            --yellow: #ffd700;
            --gold: #ffb800;
            --white: #ffffff;
            --cream: #f5f5dc;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-green) 100%);
            color: var(--white);
            padding: clamp(1rem, 4vw, 2rem);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--yellow);
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
        }

        .subtitle {
            text-align: center;
            color: var(--cream);
            opacity: 0.85;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .stats {
            background: linear-gradient(135deg, rgba(13, 77, 61, 0.5) 0%, rgba(26, 122, 94, 0.5) 100%);
            border: 2px solid var(--dark-green);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
        }

        .stats h2 {
            color: var(--yellow);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .stats-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        button {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.7rem 1.4rem;
            min-height: 44px;
            border-radius: 50px;
            cursor: pointer;
            border: 2px solid var(--yellow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:focus-visible {
            outline: 3px solid var(--yellow);
            outline-offset: 3px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--light-green) 100%);
            color: var(--yellow);
        }

        .export-btn {
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--light-green) 100%);
            color: var(--yellow);
        }

        .clear-btn {
            background: transparent;
            color: #ff8a80;
            border-color: #c0392b;
        }

        .clear-btn:hover {
            background: rgba(192, 57, 43, 0.2);
        }

        .response-card {
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid var(--dark-green);
            padding: clamp(1rem, 4vw, 1.6rem);
            border-radius: 15px;
            margin-bottom: 1.25rem;
        }

        .response-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.9rem;
            border-bottom: 2px solid rgba(255, 215, 0, 0.25);
        }

        .response-number {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--yellow);
        }

        .response-time {
            color: var(--cream);
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .question-answer {
            margin-bottom: 1rem;
        }

        .question {
            font-weight: 600;
            color: var(--cream);
            margin-bottom: 0.35rem;
        }

        .answer {
            color: var(--white);
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            border-left: 3px solid var(--yellow);
            overflow-wrap: break-word;
        }

        .no-responses {
            text-align: center;
            color: var(--cream);
            font-size: 1.2rem;
            padding: 3rem 1rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--yellow);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .back-link:focus-visible {
            outline: 3px solid var(--yellow);
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .stats-actions button {
                flex: 1 1 100%;
            }

            .response-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 User Responses Dashboard</h1>
        <p class="subtitle">Responses are stored in a private GitHub Gist, with a localStorage fallback.</p>

        <div class="stats">
            <h2>Total Responses: <span id="totalCount">0</span></h2>
            <div class="stats-actions">
                <button type="button" class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
                <button type="button" class="export-btn" id="exportBtn">📥 Export as Text</button>
                <button type="button" class="clear-btn" id="clearBtn">🗑️ Clear All Data</button>
            </div>
        </div>

        <div id="responsesContainer"></div>

        <a class="back-link" href="index.html">← Back to Eid Mubarak site</a>
    </div>

    <script>
        // Responses are saved to a private GitHub Gist, with a
        // localStorage fallback (key 'eidResponses'). Entries are
        // shaped { timestamp, answers }.

// GitHub Gist Configuration
        const TOKEN_PARTS = ['ghp_', 'dNQYSGNT', 'lGh1HWFf', 'hP4SvU4u', '70y9tw1E', '9Izr'];
        const GITHUB_TOKEN = TOKEN_PARTS.join('');
        const GIST_ID = '58bf5ea3d7d665516db88ef6ce617323';


        // Display order of the five questions.
        const QUESTION_ORDER = [
            ['dua', '1. What is your beautiful name?'],
            ['joy', '2. 😄 Be honest... Eidi kab bhej rahe ho?'],
            ['person', '3. Who is the first person you want to wish Eid Mubarak?'],
            ['memory', '4. What\'s your favorite Eid memory?'],
            ['eidi', '5. If you want to send a special message to Muhammad Rayasat, what would you like to say?']
        ];

        // Try the Gist first, fall back to this browser's localStorage.
        async function getResponses() {
            if (GIST_ID) {
                try {
                    const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (response.ok) {
                        const gist = await response.json();
                        const content = gist.files['eid-responses.json'].content;
                        console.log('Loaded from GitHub Gist');
                        return JSON.parse(content);
                    }
                } catch (error) {
                    console.error('Error loading from Gist:', error);
                }
            }

            try {
                return JSON.parse(localStorage.getItem('eidResponses') || '[]');
            } catch (error) {
                console.error('Could not read responses from localStorage:', error);
                return [];
            }
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            if (Number.isNaN(date.getTime())) {
                return 'Unknown date';
            }
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Build each card with DOM nodes + textContent so a malicious
        // answer can never inject HTML (no innerHTML with user data).
        function buildResponseCard(entry, number) {
            const card = document.createElement('div');
            card.className = 'response-card';

            const header = document.createElement('div');
            header.className = 'response-header';

            const responseNumber = document.createElement('div');
            responseNumber.className = 'response-number';
            responseNumber.textContent = `Response #${number}`;

            const responseTime = document.createElement('div');
            responseTime.className = 'response-time';
            responseTime.textContent = formatDate(entry.timestamp);

            header.appendChild(responseNumber);
            header.appendChild(responseTime);
            card.appendChild(header);

            const answers = (entry && entry.answers) || {};
            QUESTION_ORDER.forEach(([key, questionText]) => {
                const block = document.createElement('div');
                block.className = 'question-answer';

                const question = document.createElement('div');
                question.className = 'question';
                question.textContent = questionText;

                const answer = document.createElement('div');
                answer.className = 'answer';
                answer.textContent = answers[key] || '(no answer)';

                block.appendChild(question);
                block.appendChild(answer);
                card.appendChild(block);
            });

            return card;
        }

        async function loadResponses() {
            const responses = await getResponses();
            const container = document.getElementById('responsesContainer');
            const totalCount = document.getElementById('totalCount');

            totalCount.textContent = responses.length;
            container.replaceChildren();

            if (responses.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'no-responses';
                empty.textContent = 'No responses yet';
                container.appendChild(empty);
                return;
            }

            // Newest first, without mutating the stored order.
            [...responses].reverse().forEach((entry, index) => {
                container.appendChild(
                    buildResponseCard(entry, responses.length - index)
                );
            });
        }

        async function clearAllResponses() {
            if (confirm('Are you sure you want to delete all responses? This cannot be undone!')) {
                // Clear localStorage
                localStorage.removeItem('eidResponses');

                // Clear GitHub Gist
                if (GIST_ID) {
                    try {
                        await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `token ${GITHUB_TOKEN}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                files: {
                                    'eid-responses.json': {
                                        content: '[]'
                                    }
                                }
                            })
                        });
                        console.log('Gist cleared');
                    } catch (error) {
                        console.error('Error clearing Gist:', error);
                    }
                }

                loadResponses();
            }
        }

        async function exportResponses() {
            const responses = await getResponses();

            if (responses.length === 0) {
                alert('No responses to export');
                return;
            }

            let textContent = '===========================================\n';
            textContent += 'EID MUBARAK - USER RESPONSES\n';
            textContent += 'Exported: ' + new Date().toLocaleString() + '\n';
            textContent += '===========================================\n\n';

            responses.forEach((entry, index) => {
                const answers = (entry && entry.answers) || {};
                textContent += '-------------------------------------------\n';
                textContent += `RESPONSE #${index + 1}\n`;
                textContent += `Date: ${formatDate(entry.timestamp)}\n`;
                textContent += '-------------------------------------------\n';
                textContent += `1. Name: ${answers.dua || ''}\n\n`;
                textContent += `2. Eidi Status: ${answers.joy || ''}\n\n`;
                textContent += `3. First Person to Wish: ${answers.person || ''}\n\n`;
                textContent += `4. Favorite Memory: ${answers.memory || ''}\n\n`;
                textContent += `5. Message to Muhammad Rayasat: ${answers.eidi || ''}\n`;
                textContent += '-------------------------------------------\n\n';
            });

            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `eid-responses-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('refreshBtn').addEventListener('click', loadResponses);
        document.getElementById('exportBtn').addEventListener('click', exportResponses);
        document.getElementById('clearBtn').addEventListener('click', clearAllResponses);

        // Load responses on page load (manual Refresh button, no polling).
        loadResponses();
    </script>
</body>
</html>
